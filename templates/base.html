<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тут название нашего чуда{% block title %}{% endblock title %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- header -->
    <header class="site-header">
        <div class="container header-inner">
        <a class="logo" href="{{ url_for('index') }}" aria-label="На главную">
            <span class="logo-mark">V</span>
            <span class="logo-text">VPN<span class="logo-dot">.</span></span>
        </a>

        <button class="burger" id="burger" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="nav">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav" id="nav" aria-label="Основная навигация">
            <ul class="nav-list">
            <li><a class="nav-link" href="{{ url_for('errors') }}">Частые ошибки</a></li>
            <li><a class="nav-link" href="{{ url_for('faq') }}">FAQ</a></li>
            </ul>
            <a class="btn btn-ghost nav-profile is-active" href="{{ url_for('profile') }}" aria-current="page">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>
            </svg>
            Профиль
            </a>
        </nav>
        </div>
    </header>
    <!-- end header -->

    {% block content %}
        
    {% endblock content %}

    <!-- footer -->
    <footer class="site-footer">
        <div class="container footer-inner">
        <span>© 2026 VPN. Все права защищены.</span>
        <span class="footer-note">Сделано с заботой о вашей приватности</span>
        </div>
    </footer>
    <!-- end footer -->

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
